<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1020" />
    <title>LOCO</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='logo.png') }}" />
    <link rel="shortcut icon" href="{{ url_for('static', filename='logo.png') }}" />
    <meta name="theme-color" content="#080B18">
    <!-- Runs before first paint: restores theme + language, loads the right Bootstrap (LTR or RTL) -->
    <script>
        (function () {
            var d = document.documentElement;
            var ls = function (k) {
                try {
                    return localStorage.getItem(k);
                } catch (e) {
                    return null;
                }
            };

            var lang = ls("loco_lang");
            if (lang !== "ar" && lang !== "en") {
                lang =
                    (navigator.language || "").toLowerCase().indexOf("ar") === 0
                        ? "ar"
                        : "en";
            }

            var theme = ls("loco_theme");
            if (theme !== "dark" && theme !== "light") {
                theme =
                    window.matchMedia &&
                        matchMedia("(prefers-color-scheme: light)").matches
                        ? "light"
                        : "dark";
            }

            d.lang = lang;
            d.dir = lang === "ar" ? "rtl" : "ltr";
            d.setAttribute("data-bs-theme", theme);

            var css =
                "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap" +
                (lang === "ar" ? ".rtl" : "") +
                ".min.css";
            document.write(
                '<link id="bs-css" rel="stylesheet" href="' + css + '">',
            );
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body class="d-flex flex-column in-lobby" data-audio-base="{{ url_for('static', filename='audio/') }}">
    <!-- ================= HEADER ================= -->
    <header class="loco-header sticky-top">
        <div class="container d-flex align-items-center justify-content-between py-2">
            <span class="loco-logo loco-logo-sm" aria-label="LOCO">LOCO</span>

            <div class="d-flex align-items-center gap-2">
                <!-- Sound controls -->
                <div class="dropdown">
                    <button id="soundBtn" class="icon-btn" type="button" data-bs-toggle="dropdown"
                        data-bs-auto-close="outside" aria-expanded="false" data-i18n-title="sound">
                        <i id="soundIcon" class="bi bi-volume-up-fill"></i>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end sound-menu p-3">
                        <div class="d-flex gap-2 mb-3">
                            <button id="musicToggle" type="button" class="btn btn-sm btn-loco flex-fill">
                                <i id="musicIcon" class="bi bi-play-fill me-1"></i><span id="musicLabel"></span>
                            </button>
                            <button id="muteToggle" type="button" class="btn btn-sm btn-loco-outline flex-fill">
                                <i id="muteIcon" class="bi bi-volume-mute-fill me-1"></i><span id="muteLabel"></span>
                            </button>
                        </div>
                        <label for="volumeRange" class="form-label small mb-1" data-i18n="volume"></label>
                        <input id="volumeRange" type="range" class="form-range" min="0" max="100" step="1" />
                        <div class="form-check form-switch mt-2 mb-0">
                            <input id="sfxSwitch" class="form-check-input" type="checkbox" role="switch" />
                            <label class="form-check-label small" for="sfxSwitch" data-i18n="soundEffects"></label>
                        </div>
                    </div>
                </div>

                <!-- Language -->
                <button id="langBtn" class="icon-btn icon-btn-text" type="button" data-i18n-title="switchLang">
                    <span id="langLabel">EN</span>
                </button>

                <!-- Theme -->
                <button id="themeBtn" class="icon-btn" type="button" data-i18n-title="toggleTheme">
                    <i id="themeIcon" class="bi bi-sun-fill"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center py-3 py-md-4">
        <div class="container">
            <!-- ================= LOBBY ================= -->
            <section id="lobby" class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                    <div class="loco-card p-4 p-md-5 text-center">
                        <div class="loco-logo loco-logo-lg mb-3">LOCO</div>
                        <h1 class="h4 mb-1" data-i18n="welcome"></h1>
                        <p class="text-body-secondary mb-4" data-i18n="welcomeSub"></p>

                        <button id="createBtn" type="button" class="btn btn-loco btn-lg w-100 mb-3">
                            <i class="bi bi-plus-circle-fill me-2"></i><span data-i18n="createRoom"></span>
                        </button>

                        <div class="divider-text mb-3"><span data-i18n="or"></span></div>

                        <form id="joinForm" autocomplete="off" novalidate>
                            <div class="input-group input-group-lg mb-2">
                                <input id="roomInput" type="text" class="form-control text-center room-input"
                                    maxlength="12" autocapitalize="characters" autocorrect="off" spellcheck="false"
                                    data-i18n-placeholder="roomPlaceholder" data-i18n-title="roomPlaceholder" />
                                <button id="copyLobby" type="button" class="btn btn-outline-secondary"
                                    data-i18n-title="copyCode">
                                    <i class="bi bi-clipboard"></i>
                                </button>
                            </div>
                            <button type="submit" class="btn btn-loco-outline btn-lg w-100">
                                <i class="bi bi-box-arrow-in-right me-2"></i><span data-i18n="joinRoom"></span>
                            </button>
                        </form>

                        <div class="divider-text my-3"><span data-i18n="or"></span></div>

                        <button id="botBtn" type="button" class="btn btn-bot btn-lg w-100">
                            <i class="bi bi-robot me-2"></i><span data-i18n="playBot"></span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- ================= GAME ================= -->
            <section id="game" class="d-none">
                <div class="row g-3 justify-content-center">
                    <div class="col-12 col-lg-7 col-xl-6">
                        <div class="loco-card p-3 p-md-4">
                            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                                <span class="bot-only fw-semibold"><i class="bi bi-robot me-2"></i><span
                                        data-i18n="vsComputer"></span></span>
                                <div class="online-only d-flex align-items-center gap-2">
                                    <span class="text-body-secondary small" data-i18n="roomCode"></span>
                                    <span id="roomCode" class="room-code"></span>
                                    <button id="copyRoom" type="button" class="icon-btn icon-btn-sm"
                                        data-i18n-title="copyCode">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                                <span class="conn-badge online-only"><span class="conn-dot"
                                        data-state="connecting"></span><span class="conn-text small"></span></span>
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <div id="chipX" class="player-chip" data-sym="X">
                                        <span class="sym x">X</span><span id="nameX" class="chip-name"></span>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div id="chipO" class="player-chip" data-sym="O">
                                        <span class="sym o">O</span><span id="nameO" class="chip-name"></span>
                                    </div>
                                </div>
                            </div>

                            <div id="status" class="status text-center" role="status" aria-live="polite"></div>
                            <div class="text-center mb-3 d-none" id="botInsteadWrap">
                                <button id="botInsteadBtn" type="button" class="btn btn-bot btn-sm">
                                    <i class="bi bi-robot me-1"></i><span data-i18n="botInstead"></span>
                                </button>
                            </div>

                            <div class="board-wrap">
                                <div id="board" class="board">
                                    <button type="button" class="cell" data-i="0">
                                        <span class="mark"></span>
                                    </button>
                                    <button type="button" class="cell" data-i="1">
                                        <span class="mark"></span>
                                    </button>
                                    <button type="button" class="cell" data-i="2">
                                        <span class="mark"></span>
                                    </button>
                                    <button type="button" class="cell" data-i="3">
                                        <span class="mark"></span>
                                    </button>
                                    <button type="button" class="cell" data-i="4">
                                        <span class="mark"></span>
                                    </button>
                                    <button type="button" class="cell" data-i="5">
                                        <span class="mark"></span>
                                    </button>
                                    <button type="button" class="cell" data-i="6">
                                        <span class="mark"></span>
                                    </button>
                                    <button type="button" class="cell" data-i="7">
                                        <span class="mark"></span>
                                    </button>
                                    <button type="button" class="cell" data-i="8">
                                        <span class="mark"></span>
                                    </button>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap gap-2 mt-3">
                                <button id="restartBtn" type="button" class="btn btn-loco flex-fill">
                                    <i class="bi bi-arrow-repeat me-1"></i><span data-i18n="restart"></span>
                                </button>
                                <button id="backBtn" type="button" class="btn btn-loco-outline flex-fill">
                                    <i class="bi bi-house-door me-1"></i><span data-i18n="backToLobby"></span>
                                </button>
                                <!-- Mobile / tablet only: opens the chat offcanvas -->
                                <button id="chatOpenBtn" type="button"
                                    class="btn btn-loco-outline w-100 d-lg-none online-only" data-bs-toggle="offcanvas"
                                    data-bs-target="#chatOffcanvas" aria-controls="chatOffcanvas">
                                    <i class="bi bi-chat-dots-fill me-1"></i><span data-i18n="chat"></span>
                                    <span id="chatUnread" class="badge rounded-pill text-bg-danger ms-1 d-none">0</span>
                                </button>
                            </div>

                            <!-- Optional voice chat (WebRTC) -->
                            <div id="voiceBar" class="voice-bar online-only mt-3">
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <i class="bi bi-mic-fill text-body-secondary"></i>
                                    <span class="fw-semibold" data-i18n="voice"></span>
                                    <span
                                        class="small text-body-secondary ms-auto d-flex align-items-center gap-2 text-end">
                                        <span id="voiceSpinner" class="spinner-border spinner-border-sm d-none"
                                            aria-hidden="true"></span>
                                        <span id="voiceStatus"></span>
                                    </span>
                                </div>
                                <div class="d-flex flex-wrap gap-2">
                                    <button id="voiceStart" type="button" class="btn btn-loco btn-sm flex-fill">
                                        <i class="bi bi-telephone-fill me-1"></i><span data-i18n="voiceStart"></span>
                                    </button>
                                    <button id="voiceMic" type="button" class="btn btn-loco-outline btn-sm d-none">
                                        <i id="voiceMicIcon" class="bi bi-mic-fill"></i>
                                    </button>
                                    <button id="voiceSpk" type="button" class="btn btn-loco-outline btn-sm d-none">
                                        <i id="voiceSpkIcon" class="bi bi-volume-up-fill"></i>
                                    </button>
                                    <button id="voiceEnd" type="button" class="btn btn-danger btn-sm flex-fill d-none">
                                        <i class="bi bi-telephone-x-fill me-1"></i><span data-i18n="voiceEnd"></span>
                                    </button>
                                </div>
                                <audio id="voiceAudio" autoplay playsinline hidden></audio>
                            </div>
                        </div>
                    </div>

                    <!-- Desktop chat column (the chat panel moves into the offcanvas on small screens) -->
                    <div class="col-12 col-lg-5 col-xl-4 d-none d-lg-block online-only">
                        <div id="chatDesktopSlot" class="loco-card chat-slot">
                            <div id="chatPanel" class="chat-panel">
                                <div class="chat-head">
                                    <span class="fw-semibold">
                                        <i class="bi bi-chat-dots-fill me-2"></i><span data-i18n="chat"></span>
                                    </span>
                                    <span class="conn-badge"><span class="conn-dot" data-state="connecting"></span><span
                                            class="conn-text small"></span></span>
                                </div>
                                <div id="chatList" class="chat-list" aria-live="polite">
                                    <div id="chatEmpty" class="chat-empty" data-i18n="chatEmpty"></div>
                                </div>
                                <form id="chatForm" class="chat-form" autocomplete="off">
                                    <div class="input-group">
                                        <input id="chatInput" type="text" class="form-control" maxlength="200"
                                            enterkeyhint="send" data-i18n-placeholder="chatPlaceholder"
                                            data-i18n-title="chatPlaceholder" />
                                        <button id="chatSend" type="submit" class="btn btn-loco" data-i18n-title="send">
                                            <i class="bi bi-send-fill"></i>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="loco-footer text-center">
        <span class="designer">DESIGNED BY EL-GRINGO</span>
    </footer>

    <!-- Mobile chat -->
    <div class="offcanvas offcanvas-bottom loco-offcanvas" tabindex="-1" id="chatOffcanvas"
        aria-labelledby="chatOffcanvasLabel">
        <div class="offcanvas-header py-2">
            <h2 id="chatOffcanvasLabel" class="offcanvas-title h6 mb-0">
                <i class="bi bi-chat-dots-fill me-2"></i><span data-i18n="chat"></span>
            </h2>
            <span class="conn-badge ms-auto me-3"><span class="conn-dot" data-state="connecting"></span><span
                    class="conn-text small"></span></span>
            <button type="button" class="btn-close m-0" data-bs-dismiss="offcanvas" data-i18n-title="close"></button>
        </div>
        <div id="chatOffcanvasBody" class="offcanvas-body p-2 d-flex flex-column"></div>
    </div>

    <!-- Result modal -->
    <div class="modal fade" id="resultModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content loco-modal text-center">
                <div class="modal-body p-4">
                    <div id="resultEmoji" class="result-emoji"></div>
                    <h2 id="resultTitle" class="h4 mt-2"></h2>
                    <p id="resultText" class="text-body-secondary"></p>
                    <div class="d-grid gap-2">
                        <button id="playAgainBtn" type="button" class="btn btn-loco">
                            <i class="bi bi-arrow-repeat me-1"></i><span data-i18n="playAgain"></span>
                        </button>
                        <button type="button" class="btn btn-loco-outline" data-bs-dismiss="modal">
                            <span data-i18n="close"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Play vs computer -->
    <div class="modal fade" id="botModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content loco-modal">
                <div class="modal-body p-4">
                    <div class="text-center mb-3">
                        <div class="result-emoji"><i class="bi bi-robot"></i></div>
                        <h2 class="h4 mt-2" data-i18n="botTitle"></h2>
                        <p class="text-body-secondary mb-0" data-i18n="botSubtitle"></p>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn level-btn" data-level="easy">
                            <span class="fw-bold" data-i18n="levelEasy"></span>
                            <small class="d-block text-body-secondary" data-i18n="levelEasyDesc"></small>
                        </button>
                        <button type="button" class="btn level-btn" data-level="medium">
                            <span class="fw-bold" data-i18n="levelMedium"></span>
                            <small class="d-block text-body-secondary" data-i18n="levelMediumDesc"></small>
                        </button>
                        <button type="button" class="btn level-btn" data-level="hard">
                            <span class="fw-bold" data-i18n="levelHard"></span>
                            <small class="d-block text-body-secondary" data-i18n="levelHardDesc"></small>
                        </button>
                        <button type="button" class="btn btn-link text-body-secondary" data-bs-dismiss="modal">
                            <span data-i18n="cancel"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation (restart / leave) -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content loco-modal text-center">
                <div class="modal-body p-4">
                    <div class="result-emoji">
                        <i class="bi bi-exclamation-triangle-fill text-warning"></i>
                    </div>
                    <h2 id="confirmTitle" class="h5 mt-3"></h2>
                    <p id="confirmText" class="text-body-secondary"></p>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-loco-outline flex-fill" data-bs-dismiss="modal">
                            <span data-i18n="cancel"></span>
                        </button>
                        <button id="confirmOk" type="button" class="btn btn-loco flex-fill">
                            <span data-i18n="confirmYes"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Opponent asks to restart -->
    <div class="modal fade" id="restartModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static"
        data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content loco-modal text-center">
                <div class="modal-body p-4">
                    <div class="result-emoji">
                        <i class="bi bi-arrow-repeat text-info"></i>
                    </div>
                    <h2 class="h5 mt-3" data-i18n="restartIncomingTitle"></h2>
                    <p class="text-body-secondary" data-i18n="restartIncomingText"></p>
                    <div class="d-flex gap-2">
                        <button id="restartDecline" type="button" class="btn btn-danger flex-fill">
                            <span data-i18n="decline"></span>
                        </button>
                        <button id="restartAccept" type="button" class="btn btn-success flex-fill">
                            <span data-i18n="accept"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Incoming voice call -->
    <div class="modal fade" id="callModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static"
        data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content loco-modal text-center">
                <div class="modal-body p-4">
                    <div class="result-emoji">
                        <i class="bi bi-telephone-inbound-fill text-success"></i>
                    </div>
                    <h2 class="h5 mt-3" data-i18n="voiceIncoming"></h2>
                    <p class="text-body-secondary" data-i18n="voiceIncomingText"></p>
                    <div class="d-flex gap-2">
                        <button id="callReject" type="button" class="btn btn-danger flex-fill">
                            <i class="bi bi-telephone-x-fill me-1"></i><span data-i18n="voiceReject"></span>
                        </button>
                        <button id="callAccept" type="button" class="btn btn-success flex-fill">
                            <i class="bi bi-telephone-fill me-1"></i><span data-i18n="voiceAccept"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div class="toast-container position-fixed top-0 start-0 end-0 p-3 d-flex justify-content-center">
        <div id="appToast" class="toast border-0" role="status" aria-live="polite" aria-atomic="true">
            <div id="toastBody" class="toast-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bot.js') }}"></script>
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    <script src="{{ url_for('static', filename='js/voice.js') }}"></script>
</body>

</html>
